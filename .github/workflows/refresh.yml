name: refresh-proxy-queue

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay a few min under load)
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit the updated dead-proxies log back to the repo

concurrency:
  group: refresh-proxy-queue
  cancel-in-progress: false  # never overlap runs / never lose a commit mid-write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # vercel.json's ignoreCommand diffs against the previous commit

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Fetch, test, and queue proxies
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npm run refresh

      - name: Commit updated dead-proxy log
        run: |
          git config user.name "proxy-worker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dead-proxies.txt
          git diff --cached --quiet && echo "No new dead proxies, nothing to commit." && exit 0
          git commit -m "chore: append newly dead proxies [skip ci]"
          git push
